<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Đặt lại mật khẩu · Bách Ngân</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="typography.css">
<link rel="stylesheet" href="mobile-actions.css"><link rel="stylesheet" href="kiot-theme.css"></head>
<body><section class="auth"><main class="auth-card">
<h1>Đặt mật khẩu mới</h1><p id="reset-note" class="muted">Đang kiểm tra liên kết…</p>
<form id="reset-form" hidden>
<label>Mật khẩu mới<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
<label>Nhập lại mật khẩu<input name="password2" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
<label class="show-password"><input id="reset-show" type="checkbox"> Hiện mật khẩu</label>
<button id="reset-submit" class="btn primary block">Lưu mật khẩu mới</button>
</form><p id="reset-error" class="error" role="alert"></p><a id="reset-login" href="index.html">Về đăng nhập</a>
</main></section><script type="module" src="reset-password.js"></script></body></html>
