<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cổng NCC · Bách Ngân</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="typography.css">
<link rel="stylesheet" href="mobile-actions.css"><link rel="stylesheet" href="supplier-portal.css">
</head>
<body class="portal">
<main class="sup-page" style="padding:20px;max-width:1200px;margin:auto">
  <a id="supplier-back" class="btn secondary supplier-back" href="supplier.html">‹ Quay lại danh sách</a>
  <header class="page-head"><div><h1>Cổng nhà cung cấp</h1><p>Yêu cầu xin lấy trước — phản hồi từng mã của NCC mình.</p></div><button id="logout" class="btn secondary" hidden>Đăng xuất</button></header>
  <section id="supplier-auth" class="card" hidden><h2>Đăng nhập NCC</h2><form id="login-form">
    <label>Email hoặc số điện thoại<input id="login-name" autocomplete="username" maxlength="254" required></label>
    <label>Mật khẩu<input id="login-password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></label>
    <button id="login-submit" class="btn primary">Đăng nhập</button>
  </form><button type="button" class="btn ghost" id="supplier-forgot-password">Quên mật khẩu?</button></section>
  <p id="supplier-error" class="error" role="alert"></p>
  <p id="supplier-who" class="muted"></p>
  <section id="supplier-requests" hidden></section>
</main><script type="module" src="supplier-portal.js"></script><script type="module" src="mobile-actions-init.js"></script></body></html>
