name: Deploy Minh Long quick view gifts
on:
  push:
    branches: [fix/minhlong-qv-gifts-20261126]
    paths: [.github/workflows/ml-qv-gift-deploy.yml]
permissions:
  contents: read
concurrency:
  group: minhlong-qv-gift-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: php -l web-minhlong/qv-gift/ml-qv-gift.php
      - run: php -l web-minhlong/qv-gift/cache.php
      - run: npm install --prefix /tmp/qv-info --silent playwright@1.56.1
      - run: /tmp/qv-info/node_modules/.bin/playwright install chromium --only-shell
      - name: Preview, deploy and verify gift block
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: node web-minhlong/qv-gift/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minhlong-quick-view-gift
          path: ml-gift-evidence
          retention-days: 7
