# Chụp giao diện (chỉ đọc, giỏ khách tạm). Chạy khi .github/ui-shots.run đổi.
name: Chụp giao diện web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/ui-shots.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          [ -f .github/ui-shots.run ] || exit 0
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.63.0
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/maintenance/web-lock-ui-shots.mjs" .
          node web-lock-ui-shots.mjs
