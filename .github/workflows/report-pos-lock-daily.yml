name: Báo cáo POS Lock theo ngày
on:
  workflow_dispatch:
    inputs:
      business_date:
        description: Ngày kinh doanh YYYY-MM-DD
        required: true
        type: string
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: taceqfnsorewelsbdckg
      REPORT_DATE: ${{ inputs.business_date }}
    steps:
      - name: Đọc báo cáo chỉ đọc
        shell: bash
        run: |
          [[ "$REPORT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'Ngày không hợp lệ'; exit 1; }
          query=$(cat <<'SQL'
          select json_build_object(
            'business_date', 'DATE_TOKEN',
            'orders', coalesce(json_agg(row_to_json(x) order by x.created_at) filter (where x.order_no is not null), '[]'::json),
            'summary', json_build_object(
              'count', count(x.order_no),
              'total', coalesce(sum(x.total) filter (where x.status <> 'cancelled'), 0),
              'cash', coalesce(sum(x.cash) filter (where x.status <> 'cancelled'), 0),
              'transfer', coalesce(sum(x.transfer) filter (where x.status <> 'cancelled'), 0),
              'other', coalesce(sum(x.other_amount) filter (where x.status <> 'cancelled'), 0)
            )
          )
          from (
            select o.order_no, o.customer_name, o.total, o.status, o.fulfillment_mode, r.name as register_name,
              o.created_at, coalesce(owner.name, creator.name, s.pos_snapshot::jsonb->>'memberName', '') as seller,
              'Bán hàng nhanh CRM' as source,
              coalesce((select sum(p.amount) from customer_payments p where p.order_id=o.id and p.voided_at is null and p.method='cash'),0) as cash,
              coalesce((select sum(p.amount) from customer_payments p where p.order_id=o.id and p.voided_at is null and p.method='transfer'),0) as transfer,
              coalesce((select sum(p.amount) from customer_payments p where p.order_id=o.id and p.voided_at is null and p.method not in ('cash','transfer')),0) as other_amount,
              coalesce(s.pos_snapshot::jsonb->>'method','') as checkout_method
            from sales_orders o
            join pos_shifts sh on sh.id=o.shift_id
            join pos_registers r on r.id=sh.register_id
            left join staff_members owner on owner.id=o.owner_id
            left join staff_members creator on creator.id=o.created_by
            left join sales_orders s on s.id=o.id
            where o.channel='pos' and sh.business_date='DATE_TOKEN'
          ) x;
          SQL
          )
          query=${query//DATE_TOKEN/$REPORT_DATE}
          payload=$(jq -n --arg query "$query" '{query:$query}')
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$payload" | jq -c '.[0]'
