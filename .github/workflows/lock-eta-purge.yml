name: Refresh Lock ETA public cache
on:
  push:
    branches: [codex/minhlong-approved-shipping-20261117]
    paths: [web-lock/shipping/purge-mobile-eta.mjs, .github/workflows/lock-eta-purge.yml]
permissions:
  contents: read
concurrency:
  group: lock-store-ai-deploy
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Refresh targeted public cache and verify
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: node web-lock/shipping/purge-mobile-eta.mjs
