name: ChatGPT access audit
on:
  push:
    branches: [codex/chatgpt-access-20261119]
    paths: [web-shared/chatgpt-access/audit.mjs, .github/workflows/chatgpt-access-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node --check web-shared/chatgpt-access/audit.mjs
      - run: node web-shared/chatgpt-access/audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatgpt-access-evidence
          path: chatgpt-access-evidence/
          retention-days: 7
