name: Group Minh Long desktop product menu
on:
  push:
    branches: [codex/minhlong-approved-shipping-20261117]
    paths: [web-minhlong/shipping/desktop-menu.mjs, .github/workflows/minhlong-desktop-menu.yml]
permissions:
  contents: read
concurrency:
  group: minhlong-shipping-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l web-minhlong/shipping/ml-desktop-category-groups.php
          node --check web-minhlong/shipping/desktop-menu.mjs
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Apply and check four desktop widths
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: node web-minhlong/shipping/desktop-menu.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minhlong-menu-sizes
          path: ml-*.png
          retention-days: 3
