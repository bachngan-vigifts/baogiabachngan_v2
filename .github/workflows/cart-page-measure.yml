# Đo trang giỏ hàng/thanh toán web Lock khi giỏ có 1 sản phẩm (chỉ đo, không đặt đơn). Chạy khi file .github/cart-page-measure.run đổi.
name: Đo trang giỏ hàng web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/cart-page-measure.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Đo
        run: |
          [ -f .github/cart-page-measure.run ] || exit 0
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.63.0
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/maintenance/web-lock-cart-page-measure.mjs" . && node web-lock-cart-page-measure.mjs
