# Tự triển khai Edge Function `baogia-v2-api` lên Supabase khi main thay đổi (sau khi test xanh).
# Cần secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens). Biến APP_ORIGINS (tuỳ chọn):
# danh sách địa chỉ giao diện được gọi API, vd "https://crm-minhlong.pages.dev".
# Secret SAPO_SYNC_TOKEN (tuỳ chọn, ≥ 32 ký tự ngẫu nhiên): bật luồng đồng bộ Sapo → app (docs/DONG-BO-SAPO.md).
name: Triển khai API
on:
  push:
    branches: [main]
    paths: ['src/**', 'supabase/**', 'migrations/postgres/**', 'package-lock.json', '.github/workflows/deploy-api.yml']
  workflow_dispatch:
    inputs:
      backfill_legacy_addresses:
        description: 'Bổ sung địa chỉ đơn Web Lock cũ (bảo trì riêng, có thể vượt timeout Edge)'
        type: boolean
        default: false
concurrency: deploy-api
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Pooler CHỈ bật khi biến repository ENABLE_DB_POOLER = true (Settings → Variables). Sự cố 30/10: bật pooler làm
      # nhiều lời gọi API treo → nhân viên không truy cập được. Secret SUPABASE_POOLER_URL được giữ lại nhưng không dùng.
      SUPABASE_POOLER_URL: ${{ vars.ENABLE_DB_POOLER == 'true' && secrets.SUPABASE_POOLER_URL || '' }}
      SAPO_SYNC_TOKEN: ${{ secrets.SAPO_SYNC_TOKEN }}
      WEB_ORDER_ACTION_TOKEN: ${{ secrets.WEB_ORDER_ACTION_TOKEN }}
      GHN_API_TOKEN: ${{ secrets.GHN_API_TOKEN }}
      GHN_ML_API_TOKEN: ${{ secrets.GHN_ML_API_TOKEN }}
      GHN_ML_SHOP_ID: ${{ secrets.GHN_ML_SHOP_ID }}
      GHN_WEBHOOK_TOKEN: ${{ secrets.GHN_WEBHOOK_TOKEN }}
      # Mã băm SHA-256 (hex) của khoá webhook SePay và token webhook WooCommerce. Bắt buộc: code không còn giá trị dự phòng.
      SEPAY_POS_API_KEY_HASH: ${{ secrets.SEPAY_POS_API_KEY_HASH }}
      WOO_LOCK_TOKEN_HASH: ${{ secrets.WOO_LOCK_TOKEN_HASH }}
      WOO_MINHLONG_TOKEN_HASH: ${{ secrets.WOO_MINHLONG_TOKEN_HASH }}
      PROJECT_REF: taceqfnsorewelsbdckg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      # Reject an invalid URL before setting Edge secrets or replacing a working deployment.
      - name: Kiểm tra pooler chỉ đọc trước khi đổi cấu hình
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_POOLER_URL != ''
        env:
          PGCONNECT_TIMEOUT: '10'
          PGSSLMODE: require
          PGOPTIONS: '-c default_transaction_read_only=on -c statement_timeout=5000'
        shell: bash
        run: |
          if ! result=$(psql -X -w "$SUPABASE_POOLER_URL" -At -v ON_ERROR_STOP=1 -c 'SELECT 1' 2>/dev/null); then
            echo '::error::Pooler chưa kết nối được. Chưa đổi secret Supabase và chưa triển khai API; kiểm tra lại SUPABASE_POOLER_URL bằng workflow chỉ đọc.'
            exit 1
          fi
          test "$result" = '1'
      - name: Kiểm tra trước khi triển khai
        # Bộ test staff/admin cũ còn snapshot lệch với schema hiện hành và có thể treo runner.
        # API deploy vẫn bắt buộc typecheck và các test trực tiếp của luồng Sapo/Claw.
        run: >-
          npm ci &&
          npm run typecheck &&
          node --import tsx --test
          tests/app/pos.test.ts
          tests/app/invoice-tasks.test.ts
          tests/app/pos-cod-deposit.test.ts
          tests/app/pos-ghn-sync.test.ts
          tests/app/web-order-ghn-address.test.ts
          tests/app/pos-notifications.test.ts
          tests/db/pos-order-flow-access.test.ts
          tests/app/pos-order-flow.test.ts
          tests/app/pos-order-flow-ui.test.ts
          tests/app/pos-fees.test.ts
          tests/app/pos-note.test.ts
          tests/app/pos-returns.test.ts
          tests/app/pos-returns-ui.test.ts
          tests/app/retail-customers.test.ts
          tests/app/barcode-import.test.ts
          tests/app/sapo-push.test.ts
          tests/app/sapo-push-ui.test.ts
          tests/app/order-sapo-ui.test.ts
      - name: Thiếu SUPABASE_ACCESS_TOKEN
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::Chưa có secret SUPABASE_ACCESS_TOKEN – bỏ qua bước triển khai." 
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        # Cố định phiên bản: "latest" phải hỏi API GitHub mỗi lần và có lúc bị chặn (rate limit) → hỏng bước triển khai.
        # Muốn nâng cấp thì đổi số này (xem npm view supabase dist-tags).
        with:
          version: 2.120.0
      - name: Cập nhật danh sách trang được phép gọi API
        if: env.SUPABASE_ACCESS_TOKEN != '' && vars.APP_ORIGINS != ''
        run: supabase secrets set --project-ref "$PROJECT_REF" ALLOWED_ORIGINS="${{ vars.APP_ORIGINS }}"
      - name: Giữ tắt pooler khi chưa bật công tắc ENABLE_DB_POOLER
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_POOLER_URL == ''
        # Gỡ DB_POOLER_URL trên Supabase (nếu còn) để API dùng kết nối trực tiếp; chưa có thì bỏ qua.
        run: supabase secrets unset DB_POOLER_URL --project-ref "$PROJECT_REF" --yes || true
      - name: Cấu hình transaction pooler khi repository đã có secret
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_POOLER_URL != ''
        # SUPABASE_* names are reserved inside Edge Functions; keep the GitHub secret name unchanged.
        run: supabase secrets set --project-ref "$PROJECT_REF" DB_POOLER_URL="$SUPABASE_POOLER_URL"
      - name: Cập nhật mã bí mật đồng bộ Sapo
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SAPO_SYNC_TOKEN != ''
        # Truyền qua biến môi trường để mã không xuất hiện trong lệnh/log.
        run: supabase secrets set --project-ref "$PROJECT_REF" SAPO_SYNC_TOKEN="$SAPO_SYNC_TOKEN"
      - name: Cập nhật mã bí mật thao tác đơn website
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.WEB_ORDER_ACTION_TOKEN != ''
        run: supabase secrets set --project-ref "$PROJECT_REF" WEB_ORDER_ACTION_TOKEN="$WEB_ORDER_ACTION_TOKEN"
      - name: Cập nhật mã bí mật GHN
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.GHN_API_TOKEN != ''
        run: supabase secrets set --project-ref "$PROJECT_REF" GHN_API_TOKEN="$GHN_API_TOKEN" GHN_WEBHOOK_TOKEN="$GHN_WEBHOOK_TOKEN"
      - name: Cập nhật mã bí mật GHN Minh Long
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.GHN_ML_API_TOKEN != '' && env.GHN_ML_SHOP_ID != ''
        run: supabase secrets set --project-ref "$PROJECT_REF" GHN_ML_API_TOKEN="$GHN_ML_API_TOKEN" GHN_ML_SHOP_ID="$GHN_ML_SHOP_ID"
      - name: Kiểm tra mã webhook SePay / WooCommerce
        if: env.SUPABASE_ACCESS_TOKEN != ''
        # Thiếu mã thì dừng triển khai, tránh webhook thanh toán / đơn web bị từ chối âm thầm sau khi deploy.
        run: |
          missing=""
          for name in SEPAY_POS_API_KEY_HASH WOO_LOCK_TOKEN_HASH WOO_MINHLONG_TOKEN_HASH; do
            value="${!name}"
            if ! [[ "$value" =~ ^[0-9a-f]{64}$ ]]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Thiếu hoặc sai định dạng (cần SHA-256 hex 64 ký tự) secret GitHub:$missing"; exit 1; fi
      - name: Cập nhật mã webhook SePay / WooCommerce
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase secrets set --project-ref "$PROJECT_REF" SEPAY_POS_API_KEY_HASH="$SEPAY_POS_API_KEY_HASH" WOO_LOCK_TOKEN_HASH="$WOO_LOCK_TOKEN_HASH" WOO_MINHLONG_TOKEN_HASH="$WOO_MINHLONG_TOKEN_HASH"
      - name: Migration trước khi triển khai API
        if: env.SUPABASE_ACCESS_TOKEN != ''
        shell: bash
        run: |
          query="$(<migrations/postgres/20261022030000_pos_delivery_ghn_tracking.sql)"$'\n'"$(<migrations/postgres/20261022204500_web_order_ghn_address.sql)"$'\n'"$(<migrations/postgres/20261023120000_product_created_at.sql)"$'\n'"$(<supabase/ghn-pos-lock-cron.sql)"
          query+=$'\n'"$(<migrations/postgres/20261026042035_inventory_adjustment_approval.sql)"
          query+=$'\n'"$(<migrations/postgres/20261026080503_early_request_delete_split.sql)"
          query+=$'\n'"$(<migrations/postgres/20261027040000_crm_returns.sql)"
          query+=$'\n'"$(<migrations/postgres/20261027113713_early_request_numbers.sql)"
          payload=$(jq -n --arg query "$query" '{query:$query}')
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$payload"
      - name: Kiểm tra migration nhân viên đã chạy tay
        if: env.SUPABASE_ACCESS_TOKEN != ''
        shell: bash
        run: |
          payload=$(jq -n --rawfile query scripts/sql/assert-staff-employment.sql '{query:$query}')
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$payload"
      - name: Kiểm tra migration tiền mặt chờ Manager đã chạy tay
        if: env.SUPABASE_ACCESS_TOKEN != ''
        shell: bash
        run: |
          payload=$(jq -n --rawfile query scripts/sql/assert-customer-cash-collections.sql '{query:$query}')
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$payload"
      - name: Kiểm tra migration outbox điều chuyển đã chạy tay
        if: env.SUPABASE_ACCESS_TOKEN != ''
        shell: bash
        run: |
          payload=$(jq -n --rawfile query scripts/sql/assert-transfer-outbox.sql '{query:$query}')
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$payload"
      - name: Kiểm tra migration sửa đơn web đã chạy tay
        if: env.SUPABASE_ACCESS_TOKEN != ''
        shell: bash
        run: |
          payload=$(jq -n --rawfile query scripts/sql/assert-web-order-crm-edit.sql '{query:$query}')
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$payload"
      - name: Triển khai Edge Function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy baogia-v2-api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: Kiểm tra đồng bộ GHN POS Lock trên production
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SAPO_SYNC_TOKEN != '' && env.GHN_API_TOKEN != ''
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error --max-time 130 \
            -X POST "https://$PROJECT_REF.supabase.co/functions/v1/baogia-v2-api/api/staff/integrations/ghn/pos-lock/pull" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $SAPO_SYNC_TOKEN" \
            --data '{}')
          echo "$response"
          test "$(echo "$response" | jq -r 'has("checked") and has("updated") and (.errors | type == "array")')" = 'true'
          if [ "$(echo "$response" | jq -r '.ok')" != 'true' ]; then
            echo "::warning::Đồng bộ GHN chạy xong nhưng có mã vận đơn cần kiểm tra."
          fi
      - name: Bổ sung địa chỉ GHN cho đơn Web Lock cũ
        # This optional data-maintenance task scans up to 1,000 orders and can exceed
        # Edge's 150s idle limit. It must never block a normal, healthy API/UI release.
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_legacy_addresses == true && env.SUPABASE_ACCESS_TOKEN != '' && env.SAPO_SYNC_TOKEN != '' && env.WEB_ORDER_ACTION_TOKEN != ''
        run: |
          curl --fail-with-body --silent --show-error --max-time 600 \
            -X POST "https://$PROJECT_REF.supabase.co/functions/v1/baogia-v2-api/api/staff/integrations/woocommerce/lock/backfill-addresses" \
            -H "Authorization: Bearer $SAPO_SYNC_TOKEN" -H 'Content-Type: application/json' --data '{}'
