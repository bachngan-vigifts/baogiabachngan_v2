      # DML only: preserve the existing Accounting visibility once. The audit marker
      # prevents subsequent deployments from restoring a Manager-revoked permission.
      - name: Khởi tạo quyền xem trang SePay một lần
        if: env.SUPABASE_ACCESS_TOKEN != ''
        shell: bash
        run: |
          query="$(<migrations/postgres/20261110020309_sepay_page_permission.sql)"$'\n'"$(<scripts/sql/assert-sepay-page-permission.sql)"
          payload=$(jq -n --arg query "$query" '{query:$query}')
          curl --fail-with-body --silent --show-error -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$payload"
      - name: Triển khai Edge Function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy baogia-v2-api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: Cài lịch và kiểm tra đồng bộ SePay
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SEPAY_API_TOKEN != '' && env.SAPO_SYNC_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          for sql_file in supabase/sepay-pull-cron.sql scripts/sql/assert-sepay-pull-cron.sql; do
            payload=$(jq -n --rawfile query "$sql_file" '{query:$query}')
            curl --fail --silent --show-error --max-time 30 -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$payload"
          done
          result_file=$(mktemp)
          trap 'rm -f "$result_file"' EXIT
          code=$(curl --silent --show-error --max-time 110 --output "$result_file" --write-out '%{http_code}' \
            --request POST "https://$PROJECT_REF.supabase.co/functions/v1/baogia-v2-api/api/staff/integrations/sepay/pull" \
            --header "Authorization: Bearer $SAPO_SYNC_TOKEN" --header 'Content-Type: application/json' --data '{}')
          if [ "$code" != '200' ]; then
            echo "::error::Đồng bộ SePay lần đầu lỗi HTTP $code; không in nội dung phản hồi."
            exit 1
          fi
          jq -e '(.day | type == "string") and (.read | type == "number") and .receiptsCreated == 0' "$result_file" >/dev/null
          jq -c '{day,read,imported,duplicate,outgoing,receiptsCreated}' "$result_file"
      - name: Kiểm tra đồng bộ GHN POS Lock trên production
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SAPO_SYNC_TOKEN != '' && env.GHN_API_TOKEN != ''
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error --max-time 130 \
            -X POST "https://$PROJECT_REF.supabase.co/functions/v1/baogia-v2-api/api/staff/integrations/ghn/pos-lock/pull" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $SAPO_SYNC_TOKEN" \
            --data '{}')
          echo "$response"
          test "$(echo "$response" | jq -r 'has("checked") and has("updated") and (.errors | type == "array")')" = 'true'
          if [ "$(echo "$response" | jq -r '.queued // false')" = 'true' ]; then
            echo 'GHN đã vào hàng đợi; cần kiểm tra worker/job hoàn tất, HTTP 200 chưa chứng minh đã đồng bộ.'
          elif [ "$(echo "$response" | jq -r '.ok')" != 'true' ]; then
            echo "::warning::Đồng bộ GHN chạy xong nhưng có mã vận đơn cần kiểm tra."
          fi
      - name: Bổ sung địa chỉ GHN cho đơn Web Lock cũ
        # This optional data-maintenance task scans up to 1,000 orders and can exceed
        # Edge's 150s idle limit. It must never block a normal, healthy API/UI release.
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_legacy_addresses == true && env.SUPABASE_ACCESS_TOKEN != '' && env.SAPO_SYNC_TOKEN != '' && env.WEB_ORDER_ACTION_TOKEN != ''
        run: |
          curl --fail-with-body --silent --show-error --max-time 600 \
            -X POST "https://$PROJECT_REF.supabase.co/functions/v1/baogia-v2-api/api/staff/integrations/woocommerce/lock/backfill-addresses" \
            -H "Authorization: Bearer $SAPO_SYNC_TOKEN" -H 'Content-Type: application/json' --data '{}'
