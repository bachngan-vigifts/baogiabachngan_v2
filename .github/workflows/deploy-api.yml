# Tự triển khai Edge Function `baogia-v2-api` lên Supabase khi main thay đổi (sau khi test xanh).
# Cần secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens). Biến APP_ORIGINS (tuỳ chọn):
# danh sách địa chỉ giao diện được gọi API, vd "https://crm-minhlong.pages.dev".
# Secret SAPO_SYNC_TOKEN (tuỳ chọn, ≥ 32 ký tự ngẫu nhiên): bật luồng đồng bộ Sapo → app (docs/DONG-BO-SAPO.md).
# Secret API_PROXY_SECRET (tuỳ chọn, ≥ 32 ký tự ngẫu nhiên, TRÙNG secret cùng tên ở "Triển khai giao diện"): tin IP người dùng
# do proxy /api/staff của giao diện gửi kèm (giới hạn số lần đăng nhập theo IP thật).
name: Triển khai API
on:
  push:
    branches: [main]
    paths: ['src/**', 'supabase/**', 'package-lock.json', '.github/workflows/deploy-api.yml']
  workflow_dispatch:
concurrency: deploy-api
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SAPO_SYNC_TOKEN: ${{ secrets.SAPO_SYNC_TOKEN }}
      API_PROXY_SECRET: ${{ secrets.API_PROXY_SECRET }}
      PROJECT_REF: taceqfnsorewelsbdckg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Kiểm tra trước khi triển khai
        run: npm ci && npm run typecheck && npm test
      - name: Thiếu SUPABASE_ACCESS_TOKEN
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::Chưa có secret SUPABASE_ACCESS_TOKEN – bỏ qua bước triển khai." 
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        # Cố định phiên bản: "latest" phải hỏi API GitHub mỗi lần và có lúc bị chặn (rate limit) → hỏng bước triển khai.
        # Muốn nâng cấp thì đổi số này (xem npm view supabase dist-tags).
        with:
          version: 2.120.0
      - name: Cập nhật danh sách trang được phép gọi API
        if: env.SUPABASE_ACCESS_TOKEN != '' && vars.APP_ORIGINS != ''
        run: supabase secrets set --project-ref "$PROJECT_REF" ALLOWED_ORIGINS="${{ vars.APP_ORIGINS }}"
      - name: Cập nhật mã bí mật đồng bộ Sapo
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SAPO_SYNC_TOKEN != ''
        # Truyền qua biến môi trường để mã không xuất hiện trong lệnh/log.
        run: supabase secrets set --project-ref "$PROJECT_REF" SAPO_SYNC_TOKEN="$SAPO_SYNC_TOKEN"
      - name: Cập nhật mã bí mật proxy API
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.API_PROXY_SECRET != ''
        run: supabase secrets set --project-ref "$PROJECT_REF" API_PROXY_SECRET="$API_PROXY_SECRET"
      - name: Triển khai Edge Function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy baogia-v2-api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
