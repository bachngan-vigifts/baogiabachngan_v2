# Đo thời gian trang sản phẩm (chỉ đọc, giỏ khách tạm). Chạy khi .github/ttfb-measure.run đổi.
name: Đo thời gian trang sản phẩm web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/ttfb-measure.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          [ -f .github/ttfb-measure.run ] || exit 0
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && true
          true
          cp "$GITHUB_WORKSPACE/scripts/maintenance/web-lock-ttfb-measure.mjs" .
          node web-lock-ttfb-measure.mjs
