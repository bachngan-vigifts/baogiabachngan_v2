name: Deploy approved Minh Long shipping and category updates
on:
  push:
    branches: [codex/minhlong-approved-shipping-20261117]
    paths: [web-minhlong/shipping/deploy.mjs, .github/workflows/minhlong-shipping-deploy.yml]
permissions:
  contents: read
concurrency:
  group: minhlong-shipping-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks before production
        run: |
          php -l web-minhlong/shipping/ml-shipping-information.php
          php -l web-minhlong/shipping/ml-home-category-icons.php
          node --check web-minhlong/shipping/deploy.mjs
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Deploy approved items 1–5 and verify desktop/mobile without placing orders
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          GHN_ML_API_TOKEN: ${{ secrets.GHN_ML_API_TOKEN }}
          GHN_ML_SHOP_ID: ${{ secrets.GHN_ML_SHOP_ID }}
        run: node web-minhlong/shipping/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minhlong-shipping-desktop-mobile
          path: ml-*.png
          retention-days: 3
