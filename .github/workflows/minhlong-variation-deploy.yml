name: Deploy Minh Long variation buttons
on:
  push:
    branches: [codex/deploy-minhlong-variations-20261119]
    paths: [.github/workflows/minhlong-variation-deploy.yml]
permissions:
  contents: read
concurrency:
  group: minhlong-variation-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: php -l web-minhlong/variations/ml-variation-buttons.php
      - run: php -l web-minhlong/variations/cache.php
      - run: npm install --prefix /tmp/ml-choices --no-audit --no-fund playwright@1.56.1
      - run: timeout 180 /tmp/ml-choices/node_modules/.bin/playwright install chromium --only-shell
      - name: Preview browser checks without server writes
        run: node web-minhlong/variations/verify.mjs --preview
      - name: Deploy and verify with rollback
        run: node web-minhlong/variations/deploy.mjs
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minhlong-variation-evidence
          path: ml-choices-evidence/
          retention-days: 7

