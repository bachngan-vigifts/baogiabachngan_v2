name: Deploy subtle quick view on both stores
on:
  push:
    branches: [fix/store-subtle-quick-view-20261123]
    paths: [.github/workflows/store-subtle-quick-view-deploy.yml]
permissions:
  contents: read
concurrency:
  group: store-subtle-quick-view-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: php -l web-shared/subtle-quick-view/store-subtle-quick-view.php
      - run: php -l web-shared/subtle-quick-view/cache.php
      - run: npm install --prefix /tmp/subtle-qv --silent playwright@1.63.0
      - name: Preview, deploy and verify both stores
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: node web-shared/subtle-quick-view/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subtle-quick-view-evidence
          path: subtle-qv-evidence
          retention-days: 7

# Verify each storefront promotional popup close control.
