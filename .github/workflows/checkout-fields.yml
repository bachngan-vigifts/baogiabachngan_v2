# Liệt kê các trường ở trang thanh toán web Lock (chỉ đọc). Chạy khi file .github/checkout-fields.run đổi.
name: Liệt kê trường thanh toán web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/checkout-fields.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Đo
        run: |
          [ -f .github/checkout-fields.run ] || exit 0
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.63.0
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/maintenance/web-lock-checkout-fields.mjs" . && node web-lock-checkout-fields.mjs
