name: Lock Google Extended permission
on:
  push:
    branches: [codex/lock-google-extended-20261119]
    paths: [web-lock/google-extended/**, .github/workflows/lock-google-extended.yml]
permissions:
  contents: read
concurrency:
  group: lock-google-extended-permission
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: php -l web-lock/google-extended/lnl-google-extended.php
      - run: php -l web-lock/google-extended/cache.php
      - run: node --check web-lock/google-extended/deploy.mjs
      - run: node web-lock/google-extended/deploy.mjs
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lock-google-extended-evidence
          path: ge-evidence/
          retention-days: 7
