name: Deploy Minh Long hero links
on:
  push:
    branches: [fix/minhlong-hero-product-links-20261123]
    paths: [.github/workflows/minhlong-hero-deploy.yml]
permissions:
  contents: read
concurrency:
  group: minhlong-hero-links-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: php -l web-minhlong/hero-links/ml-hero-product-links.php
      - run: php -l web-minhlong/hero-links/cache.php
      - run: npm install --prefix /tmp/ml-hero --silent playwright@1.63.0
      - name: Preview, deploy and verify both live links
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: node web-minhlong/hero-links/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-deploy-evidence
          path: hero-evidence
          retention-days: 7
