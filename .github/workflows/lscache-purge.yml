# Dọn cache trang LiteSpeed của web Lock bằng mu-plugin tạm chạy 1 lần (tự xóa), có kiểm tra trước/sau.
# Chạy từ nhánh khi file đánh dấu .github/lscache-purge.run đổi (nội dung: dry-run hoặc apply). Không có file thì bỏ qua.
name: Dọn cache LiteSpeed web Lock
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = chỉ kiểm tra; apply = dọn cache'
        type: choice
        options: [dry-run, apply]
        default: dry-run
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/lscache-purge.run']
concurrency: lscache-purge
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xác định chế độ
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ -f .github/lscache-purge.run ]; then m=$(tr -d ' \r\n' < .github/lscache-purge.run); else m=skip; fi
          else m="${{ inputs.mode }}"; fi
          case "$m" in dry-run|apply) ;; *) m=skip ;; esac
          echo "Chế độ: $m"
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - name: Dọn cache LiteSpeed
        if: steps.mode.outputs.mode != 'skip'
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          LOCKNLOCK_DOCROOT: ${{ secrets.LOCKNLOCK_DOCROOT }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: node scripts/maintenance/cpanel-purge-lscache.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lscache-purge
          path: lscache-purge.json
          retention-days: 3
          if-no-files-found: ignore
