name: Deploy Minh Long preorder policy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minhlong-shipping-deploy
  cancel-in-progress: false
jobs:
  preorder:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-test-only
          MYSQL_DATABASE: mlpo_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pisolated-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: wp-cli
      - name: Isolated WooCommerce integration tests
        run: |
          php -l web-minhlong/preorder/ml-preorder-purchase.php
          node --check web-minhlong/preorder/deploy.mjs
          mkdir -p "$RUNNER_TEMP/mlpo-wp"
          wp core download --path="$RUNNER_TEMP/mlpo-wp"
          wp config create --path="$RUNNER_TEMP/mlpo-wp" --dbname=mlpo_test --dbuser=root --dbpass=isolated-test-only --dbhost=127.0.0.1:3306
          wp core install --path="$RUNNER_TEMP/mlpo-wp" --url=http://localhost:8090 --title=PreorderTest --admin_user=fixture --admin_password=local-fixture-only --admin_email=fixture@example.org --skip-email
          wp plugin install woocommerce --activate --path="$RUNNER_TEMP/mlpo-wp"
          mkdir -p "$RUNNER_TEMP/mlpo-wp/wp-content/mu-plugins"
          cp web-minhlong/preorder/ml-preorder-purchase.php "$RUNNER_TEMP/mlpo-wp/wp-content/mu-plugins/"
          wp eval-file "$GITHUB_WORKSPACE/web-minhlong/preorder/integration.php" --path="$RUNNER_TEMP/mlpo-wp"
      - name: Prepare browser checks
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify privately then activate preorder
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: node web-minhlong/preorder/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minhlong-preorder-checks
          path: ml-preorder-*.png
          retention-days: 3
