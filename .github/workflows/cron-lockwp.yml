# Đổi cron wp-cron web Lock sang chạy trực tiếp php mỗi 3 phút (apply) hoặc trả về như cũ (revert). Chạy khi .github/cron-lockwp.run đổi.
name: Cron wp-cron web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/cron-lockwp.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      LOCKNLOCK_DOCROOT: ${{ secrets.LOCKNLOCK_DOCROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          [ -f .github/cron-lockwp.run ] || exit 0
          MODE="$(head -1 .github/cron-lockwp.run | awk '{print $1}')" SITE="$(head -1 .github/cron-lockwp.run | awk '{print $2}')" node scripts/maintenance/cpanel-cron-lockwp.mjs
