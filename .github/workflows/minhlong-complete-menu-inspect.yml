name: Inspect complete Minh Long categories
on:
  push:
    branches: [fix/minhlong-complete-menu-20261123]
    paths: [.github/workflows/minhlong-complete-menu-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --input-type=module <<'NODE'
          for(const path of ['/wp-json/wp/v2/product_cat?per_page=100&_fields=id,name,slug,parent,count,link']){
           const r=await fetch('https://minhlongonline.com'+path);const text=await r.text();if(!text.trim().startsWith('[')){console.log('HTTP_RESPONSE',r.status,text.slice(0,120));continue;}const body=JSON.parse(text);
           console.log('CATEGORIES',r.status,JSON.stringify({pages:r.headers.get('x-wp-totalpages'),data:Array.isArray(body)?body.map(x=>({id:x.id,name:x.name,slug:x.slug,parent:x.parent,count:x.count,url:x.permalink||x.link})):body}));
          }
          NODE
