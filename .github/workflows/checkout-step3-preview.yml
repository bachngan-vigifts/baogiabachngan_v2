name: Preview mobile checkout option 3
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storefront-checkout-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l web-shared/checkout-step3/store-mobile-checkout.php
          node --check web-shared/checkout-step3/verify.mjs
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Test candidate in isolated browsers without deploying
        run: node web-shared/checkout-step3/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-step3-preview
          path: checkout-*.png
          retention-days: 5
