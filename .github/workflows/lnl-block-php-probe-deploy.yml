# Thêm mu-plugin lnl-block-php-probe.php (trả 404 sớm cho bot dò file PHP không có thật) lên web Lock.
# Quy trình: kiểm tra trước -> thêm file mới (web lỗi thì tự gỡ) -> kiểm tra sau -> không đạt thì tự gỡ. Không cần dọn cache (không đổi trang nào).
# Chạy khi file .github/lnl-block-php-probe.run đổi (nội dung: dry-run, apply hoặc rollback). Không có file thì bỏ qua.
name: Chặn bot dò file PHP web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/lnl-block-php-probe.run']
concurrency: lnl-block-php-probe
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      LOCKNLOCK_DOCROOT: ${{ secrets.LOCKNLOCK_DOCROOT }}
      FILE: lnl-block-php-probe.php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xác định chế độ
        id: mode
        run: |
          if [ -f .github/lnl-block-php-probe.run ]; then m=$(tr -d ' \r\n' < .github/lnl-block-php-probe.run); else m=skip; fi
          case "$m" in dry-run|apply|rollback) ;; *) m=skip ;; esac
          echo "Chế độ: $m"
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - name: Kiểm tra trước
        if: steps.mode.outputs.mode == 'dry-run' || steps.mode.outputs.mode == 'apply'
        run: node scripts/maintenance/web-lock-probe-check.mjs || true
      - name: Kiểm tra và thêm file
        if: steps.mode.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: node scripts/maintenance/cpanel-deploy-newfile.mjs
      - name: Kiểm tra sau
        id: verify
        if: steps.mode.outputs.mode == 'apply'
        continue-on-error: true
        env:
          EXPECT_PROBE: '1'
        run: node scripts/maintenance/web-lock-probe-check.mjs
      - name: Tự gỡ nếu kiểm tra sau không đạt
        if: steps.mode.outputs.mode == 'apply' && steps.verify.outcome == 'failure'
        env:
          MODE: rollback
        run: |
          node scripts/maintenance/cpanel-deploy-newfile.mjs
          echo "ĐÃ GỠ plugin vì kiểm tra sau không đạt"; exit 1
