# Rà plugin web Lock (chỉ đọc): liệt kê thư mục plugin và đo tài nguyên mỗi plugin nạp ở các trang chính. Chạy khi .github/plugin-audit.run đổi.
name: Rà plugin web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/plugin-audit.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      LOCKNLOCK_DOCROOT: ${{ secrets.LOCKNLOCK_DOCROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          [ -f .github/plugin-audit.run ] || exit 0
          node scripts/maintenance/cpanel-list-plugins.mjs
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.63.0
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/maintenance/web-lock-plugin-assets.mjs" .
          node web-lock-plugin-assets.mjs
