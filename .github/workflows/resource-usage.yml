# Đọc mức dùng CPU/RAM/tiến trình của hosting web Lock (chỉ đọc). Chạy khi .github/resource-usage.run đổi.
name: Đọc tài nguyên hosting web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/resource-usage.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          [ -f .github/resource-usage.run ] || exit 0
          node scripts/maintenance/cpanel-resource-usage.mjs
