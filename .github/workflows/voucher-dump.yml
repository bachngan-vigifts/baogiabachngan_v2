# Đọc cấu trúc phần Voucher Shop trên trang giỏ hàng (chỉ đọc). Chạy khi .github/voucher-dump.run đổi.
name: Đọc cấu trúc voucher web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/voucher-dump.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          [ -f .github/voucher-dump.run ] || exit 0
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.63.0
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/maintenance/web-lock-voucher-dump.mjs" .
          node web-lock-voucher-dump.mjs
