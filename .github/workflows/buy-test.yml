# Thử kỹ nút giỏ hàng và Mua ngay (chỉ đọc, giỏ khách tạm). Chạy khi .github/buy-test.run đổi.
name: Thử kỹ nút giỏ hàng và Mua ngay web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/buy-test.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          [ -f .github/buy-test.run ] || exit 0
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.63.0
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/maintenance/web-lock-buy-test.mjs" .
          ONLY=${ONLY:-6,7} EXPECT_DIRECT=1 node web-lock-buy-test.mjs
