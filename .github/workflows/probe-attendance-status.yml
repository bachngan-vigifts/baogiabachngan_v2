# Kiểm tra chỉ đọc: kết nối máy chấm công (ADMS / SyncTime) đã chạy chưa. Chỉ đếm, không in tên/mã nhân viên hay nội dung gói.
name: Kiểm tra kết nối chấm công
on:
  push:
    branches: [probe/attendance-status]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PROJECT_REF: taceqfnsorewelsbdckg
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Secret ADMS trên Edge Function (chỉ tên)
        run: |
          curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -c '[.[].name | select(test("ADMS|SYNCTIME"))]'
      - name: Trạng thái trong cơ sở dữ liệu
        run: |
          query="select json_build_object(
            'tables', json_build_object('hr_adms_logs', to_regclass('public.hr_adms_logs') is not null, 'synctime_receipts', to_regclass('public.synctime_receipts') is not null),
            'adms_sync', (select coalesce(json_agg(json_build_object('synced_at',synced_at,'from',from_date,'to',to_date,'fetched',fetched)),'[]'::json) from hr_adms_sync_state),
            'adms_logs', (select json_build_object('count',count(*),'first',min(check_time),'last',max(check_time),'last_import',max(imported_at),'devices',count(distinct device_serial),'codes',count(distinct emp_code)) from hr_adms_logs),
            'adms_mapped_members', (select count(*) from hr_adms_members),
            'synctime_connection', (select json_agg(json_build_object('updated_at',updated_at)) from synctime_connections),
            'synctime_receipts', (select json_build_object('count',count(*),'first',min(received_at),'last',max(received_at)) from synctime_receipts)
          ) as result"
          jq -n --arg query "$query" '{query:$query}' > q.json
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @q.json | jq .
