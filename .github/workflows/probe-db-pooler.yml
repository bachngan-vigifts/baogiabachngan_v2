# One-off read-only metrics audit. No keys, raw API responses or customer data are logged.
name: Kiểm tra kết nối pooler chỉ đọc
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Đo tài nguyên CSDL chỉ đọc, không bật pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: python
        run: |
          import os,json,re,time,base64,urllib.request,urllib.error,sys
          ref='taceqfnsorewelsbdckg'
          def fetch(url,auth):
              req=urllib.request.Request(url,headers={'Authorization':auth})
              with urllib.request.urlopen(req,timeout=20) as response:return response.read().decode()
          try:
              keys=json.loads(fetch('https://api.supabase.com/v1/projects/'+ref+'/api-keys?reveal=true','Bearer '+os.environ['SUPABASE_ACCESS_TOKEN']))
              candidates=[k.get('api_key','') for k in keys if k.get('type')=='secret' or k.get('name')=='service_role']
              candidates=[k for k in candidates if k]
              if not candidates:raise RuntimeError('NO_METRICS_KEY_AVAILABLE')
              auth='Basic '+base64.b64encode(('service_role:'+candidates[0]).encode()).decode()
              url='https://'+ref+'.supabase.co/customer/v1/privileged/metrics'
              def scrape():
                  result=[]
                  for line in fetch(url,auth).splitlines():
                      if line.startswith('#'):continue
                      m=re.match(r'^(node_[a-zA-Z0-9_]+)(\{[^}]*\})?\s+([-+0-9.eE]+)',line)
                      if m and (m[1].startswith('node_cpu') or m[1].startswith('node_memory') or m[1].startswith('node_disk') or m[1] in ('node_load1','node_load5')):
                          result.append((m[1],m[2] or '',float(m[3])))
                  return result
              first=scrape()
              def scalar(rows,name):return next((v for n,l,v in rows if n==name),None)
              total=scalar(first,'node_memory_MemTotal_bytes');available=scalar(first,'node_memory_MemAvailable_bytes')
              memory={'total_mib':round(total/1048576,1) if total else None,'available_mib':round(available/1048576,1) if available is not None else None,'used_pct':round(100*(total-available)/total,1) if total and available is not None else None}
              print('METRICS_FIRST='+json.dumps({'memory':memory,'load1':scalar(first,'node_load1'),'available_metric_names':sorted(set(n for n,l,v in first))}),flush=True)
              time.sleep(61)
              second=scrape()
              def cpu(rows):
                  return {l:v for n,l,v in rows if n=='node_cpu_seconds_total' and 'mode="guest' not in l}
              a,b=cpu(first),cpu(second);delta={l:v-a[l] for l,v in b.items() if l in a and v>=a[l]};t=sum(delta.values())
              idle=sum(v for l,v in delta.items() if 'mode="idle"' in l);wait=sum(v for l,v in delta.items() if 'mode="iowait"' in l);steal=sum(v for l,v in delta.items() if 'mode="steal"' in l)
              disks={}
              for metric in ('node_disk_read_bytes_total','node_disk_written_bytes_total'):
                  a={(n,l):v for n,l,v in first if n==metric and not re.search(r'device="(?:loop|ram|dm-)',l)}
                  d=sum(max(0,v-a[(n,l)]) for n,l,v in second if (n,l) in a)
                  disks[metric+'_per_second']=round(d/61,1)
              print('METRICS_WINDOW='+json.dumps({'window_seconds':61,'cpu_busy_pct':round(100*(t-idle-wait)/t,1) if t else None,'cpu_iowait_pct':round(100*wait/t,1) if t else None,'cpu_steal_pct':round(100*steal/t,1) if t else None,'disk':disks}),flush=True)
          except urllib.error.HTTPError as error:
              print('METRICS_AUDIT_HTTP_STATUS='+str(error.code));sys.exit(1)
          except Exception as error:
              print('METRICS_AUDIT_FAILED='+type(error).__name__);sys.exit(1)
