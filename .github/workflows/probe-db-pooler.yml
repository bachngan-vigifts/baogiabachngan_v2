# Support branch only: exact owner-approved DH_20261020_002 application-ledger reconciliation.
# Does not deploy code or change connection configuration; default is a non-writing preview.
name: Đối soát xuất kho DH_20261020_002 đã được duyệt
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Ghi 4 bút toán xuất đã được chủ kho xác nhận (55 cái, KHO VIGIFTS)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency: support-dh-20261020-002
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Kiểm tra giao dịch, chống trùng và rollback trước khi chạm production
        run: node --import tsx --test tests/app/approved-legacy-export.test.ts
      - name: Chạy nghiệp vụ sổ kho của ứng dụng với đúng đơn đã duyệt
        env:
          SUPPORT_DATABASE_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          APPLY_APPROVED_EXPORT: ${{ inputs.apply }}
        shell: bash
        run: |
          if [ "$APPLY_APPROVED_EXPORT" = true ]; then
            node --import tsx scripts/support/run-dh-20261020-002.ts --apply
          else
            node --import tsx scripts/support/run-dh-20261020-002.ts
          fi
