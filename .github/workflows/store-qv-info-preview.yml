name: Preview quick-view information
on:
  push:
    branches: [codex/lock-qv-info-20261123]
    paths: [web-lock/quick-view-info/preview.mjs, web-lock/quick-view-info/store-qv-info.php, .github/workflows/store-qv-info-preview.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: php -l web-lock/quick-view-info/store-qv-info.php && node --check web-lock/quick-view-info/preview.mjs
      - run: npm install --prefix /tmp/qv-info --no-audit --no-fund playwright@1.56.1
      - run: /tmp/qv-info/node_modules/.bin/playwright install chromium --only-shell
      - run: node web-lock/quick-view-info/preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qv-info-preview
          path: qv-info-evidence/
