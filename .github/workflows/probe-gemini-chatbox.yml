name: Test Gemini for Chatbox
on:
  push:
    branches: ['probe/gemini-chatbox-20261115']
    paths: ['.github/workflows/probe-gemini-chatbox.yml']
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Gemini without logging credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: python
        run: |
          import os, json, time, urllib.request, urllib.error
          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              print("RESULT=MISSING_SECRET")
              raise SystemExit(1)
          req = urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000", headers={"X-goog-api-key":key})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read())
              models = [m.get("name","") for m in data.get("models",[]) if "generateContent" in m.get("supportedGenerationMethods",[])]
              print("RESULT=MODEL_LIST_OK")
              for name in models:
                  if name.startswith("models/gemini-") and "flash" in name and all(c.isalnum() or c in "/.-_" for c in name):
                      print("AVAILABLE_MODEL=" + name)
          except urllib.error.HTTPError as error:
              print("RESULT=HTTP_ERROR")
              print("HTTP_STATUS=" + str(error.code))
              raise SystemExit(1)
          except Exception:
              print("RESULT=NETWORK_OR_RESPONSE_ERROR")
              raise SystemExit(1)
