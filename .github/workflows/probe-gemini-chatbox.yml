name: Test Gemini for Chatbox
on:
  push:
    branches: ['probe/gemini-chatbox-20261115']
    paths: ['.github/workflows/probe-gemini-chatbox.yml']
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Gemini without logging credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: python
        run: |
          import os, json, time, urllib.request, urllib.error
          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              print("RESULT=MISSING_SECRET")
              raise SystemExit(1)
          model = "gemini-2.5-flash-lite"
          payload = {"contents":[{"parts":[{"text":"Reply with exactly OK."}]}],
                     "generationConfig":{"maxOutputTokens":64,"temperature":0}}
          req = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent",
              data=json.dumps(payload).encode(),
              headers={"Content-Type":"application/json","X-goog-api-key":key},
              method="POST")
          started = time.monotonic()
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read())
              parts = data.get("candidates", [{}])[0].get("content", {}).get("parts", [])
              has_text = any(isinstance(p.get("text"), str) and p["text"].strip() for p in parts)
              print("MODEL=" + model)
              print("RESULT=" + ("OK" if has_text else "NO_TEXT"))
              print("LATENCY_MS=" + str(round((time.monotonic()-started)*1000)))
              usage = data.get("usageMetadata", {})
              for field in ("promptTokenCount","candidatesTokenCount","totalTokenCount"):
                  value = usage.get(field)
                  if isinstance(value, int):
                      print(field + "=" + str(value))
              if not has_text:
                  raise SystemExit(1)
          except urllib.error.HTTPError as error:
              print("RESULT=HTTP_ERROR")
              print("HTTP_STATUS=" + str(error.code))
              try:
                  body = json.loads(error.read())
                  status = body.get("error", {}).get("status", "")
                  allowed = {"INVALID_ARGUMENT","UNAUTHENTICATED","PERMISSION_DENIED","NOT_FOUND","RESOURCE_EXHAUSTED","FAILED_PRECONDITION","UNAVAILABLE","INTERNAL"}
                  if status in allowed:
                      print("API_STATUS=" + status)
              except Exception:
                  pass
              raise SystemExit(1)
          except Exception:
              print("RESULT=NETWORK_OR_RESPONSE_ERROR")
              raise SystemExit(1)
