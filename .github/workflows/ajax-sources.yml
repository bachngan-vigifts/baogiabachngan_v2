# Liệt kê các lệnh AJAX mà trang tự gửi về máy chủ (chỉ đọc, khách ẩn danh). Chạy khi .github/ajax-sources.run đổi.
name: Nguồn lệnh AJAX web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/ajax-sources.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          [ -f .github/ajax-sources.run ] || exit 0
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.63.0
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/maintenance/web-lock-ajax-sources.mjs" .
          node web-lock-ajax-sources.mjs
