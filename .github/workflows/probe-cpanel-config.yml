# One-time host cron setup for the authorized Minh Long GHN catalogue deployment.
# No credentials, hosting metadata, API payloads, or artifacts are emitted.
name: Configure Minh Long catalogue cron
on:
  workflow_dispatch:
permissions: {}
concurrency: ml-host-cron-setup
jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ensure host cron exists without exporting hosting configuration
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.parse, sys
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          phase = "configuration"
          try:
              base = os.environ["CPANEL_BASE_URL"].strip().rstrip("/")
              user = os.environ["CPANEL_USERNAME"].strip()
              token = os.environ["CPANEL_API_TOKEN"].strip()
              u = urllib.parse.urlsplit(base)
              if u.scheme != "https" or not u.hostname or u.username or u.password or not user or not token:
                  raise ValueError()
              base = urllib.parse.urlunsplit((u.scheme,u.netloc,"/json-api/cpanel","",""))
              opener = urllib.request.build_opener(NoRedirect)
              def api(function, extra=None):
                  data={"cpanel_jsonapi_apiversion":"2","cpanel_jsonapi_module":"Cron","cpanel_jsonapi_func":function,"cpanel_jsonapi_user":user}
                  data.update(extra or {})
                  req=urllib.request.Request(base,data=urllib.parse.urlencode(data).encode(),headers={"Authorization":"cpanel "+user+":"+token,"Content-Type":"application/x-www-form-urlencoded"})
                  with opener.open(req,timeout=30) as response:
                      result=json.load(response).get("cpanelresult",{})
                  if int(result.get("event",{}).get("result",0)) != 1 or result.get("error"):
                      raise ValueError()
                  return result.get("data",[])
              phase="read"
              rows=api("listcron")
              def is_target(row):
                  cmd=row.get("command","")
                  return "wp-cron.php" in cmd and ("minhlongonline.com/wp-cron.php" in cmd)
              existing=[r for r in rows if is_target(r)]
              if existing:
                  fast=any(str(r.get("minute")) in ("*","*/1","*/2","*/5") and all(str(r.get(k))=="*" for k in ("hour","day","month","weekday")) for r in existing)
                  if fast:
                      print("Host cron already provides a regular WordPress heartbeat; no changes.")
                      sys.exit(0)
                  print("An existing WordPress cron needs manual review; no changes.")
                  sys.exit(2)
              command="/usr/bin/curl --fail --silent --show-error --max-time 50 https://minhlongonline.com/wp-cron.php >/dev/null 2>&1"
              phase="create"
              result=api("add_line",{"command":command,"minute":"*","hour":"*","day":"*","month":"*","weekday":"*"})
              if not any(int(r.get("status",0))==1 for r in result):
                  raise ValueError()
              phase="verify"
              rows=api("listcron")
              if not any(r.get("command")==command and all(str(r.get(k))=="*" for k in ("minute","hour","day","month","weekday")) for r in rows):
                  raise ValueError()
              print("Host cron configured and verified. Catalogue refresh is scheduled by WordPress at 00:00 Asia/Ho_Chi_Minh.")
          except Exception:
              print("Host cron setup failed during "+phase+"; private response withheld.")
              sys.exit(1)
