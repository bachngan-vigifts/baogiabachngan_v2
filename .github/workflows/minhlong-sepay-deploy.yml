name: Deploy Minh Long SePay QR gate
on:
  push:
    branches: [feat/minhlong-sepay-qr-20261118]
    paths: [web-minhlong/sepay/ml-sepay-qr.php, web-minhlong/sepay/test.php, web-minhlong/sepay/deploy.mjs, .github/workflows/minhlong-sepay-deploy.yml]
  workflow_dispatch:
    inputs:
      enable_live:
        description: Enable checkout only after SePay webhook is configured
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: minhlong-sepay-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated rules and syntax
        run: |
          php -l web-minhlong/sepay/ml-sepay-qr.php
          php web-minhlong/sepay/test.php
          node --check web-minhlong/sepay/deploy.mjs
      - name: Install on Minh Long with exact readback
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          ML_SEPAY_WEBHOOK_KEY: ${{ secrets.SEPAY_API_TOKEN }}
          ML_SEPAY_ENABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_live && 'true' || 'false' }}
        run: node web-minhlong/sepay/deploy.mjs
