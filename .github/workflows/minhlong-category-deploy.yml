name: Deploy Minh Long category browsing
on:
  push:
    branches: [fix/minhlong-figurine-order-20261123]
    paths: [.github/workflows/minhlong-category-deploy.yml]
permissions:
  contents: read
concurrency:
  group: minhlong-category-browsing-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: php -l web-minhlong/category-browsing/ml-category-browsing.php
      - run: php -l web-minhlong/category-browsing/cache.php
      - run: python3 web-minhlong/category-browsing/test.py
      - run: npm install --prefix /tmp/ml-sort --silent playwright@1.63.0
      - name: Preview, back up, deploy and verify full category
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: node web-minhlong/category-browsing/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-deploy-evidence
          path: category-evidence
          retention-days: 7
