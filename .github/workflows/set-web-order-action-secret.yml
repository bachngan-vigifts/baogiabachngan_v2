name: Cấu hình bí mật thao tác đơn web
on:
  workflow_dispatch:
    inputs:
      action_token:
        description: Mã cầu nối dùng một lần để đặt Supabase secret
        required: true
        type: string
jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: taceqfnsorewelsbdckg
      ACTION_TOKEN: ${{ inputs.action_token }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Đặt secret, không ghi giá trị ra log
        shell: bash
        run: |
          echo "::add-mask::$ACTION_TOKEN"
          supabase secrets set --project-ref "$PROJECT_REF" WEB_ORDER_ACTION_TOKEN="$ACTION_TOKEN"
