name: Show clear preorder badges
on:
  push:
    branches: [codex/minhlong-approved-shipping-20261117]
    paths: [web-minhlong/preorder-badge/deploy.mjs, .github/workflows/minhlong-preorder-badge.yml]
permissions:
  contents: read
concurrency:
  group: minhlong-shipping-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l web-minhlong/preorder/ml-preorder-purchase.php
          node --check web-minhlong/preorder-badge/deploy.mjs
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Deploy and verify preorder badges
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: node web-minhlong/preorder-badge/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minhlong-preorder-badge
          path: ml-preorder-badge-*.png
          retention-days: 3
