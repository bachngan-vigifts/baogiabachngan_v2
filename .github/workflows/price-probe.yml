# Xem trước thanh mua dính đáy và nút nổi ở trang sản phẩm web Lock (chỉ đọc, CSS áp thử trong trình duyệt). Chạy khi .github/price-probe.run đổi.
name: Xem trước giá và thẻ sản phẩm web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/price-probe.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          [ -f .github/price-probe.run ] || exit 0
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.63.0
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/maintenance/web-lock-price-probe.mjs" .
          F="/nonexistent"
          if [ -f "$F" ]; then export CSS_FROM="$F"; fi
          EXPECT_ROW=1 node web-lock-price-probe.mjs
