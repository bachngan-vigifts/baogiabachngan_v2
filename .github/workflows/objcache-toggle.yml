# Tắt/bật tạm object cache (Redis) web Lock bằng đổi tên wp-content/object-cache.php. Chạy khi .github/objcache-toggle.run đổi (off | on | check).
name: Tắt bật object cache web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/objcache-toggle.run']
concurrency: objcache-toggle
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      LOCKNLOCK_DOCROOT: ${{ secrets.LOCKNLOCK_DOCROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          [ -f .github/objcache-toggle.run ] || exit 0
          MODE=$(head -c 10 .github/objcache-toggle.run | awk '{print $1}') node scripts/maintenance/cpanel-objcache-toggle.mjs
          echo "##### THỜI GIAN SAU KHI ĐỔI"; PARALLEL=0 node scripts/diagnose/lock-server-timing.mjs 2>&1 | sed -n '/Khởi động WordPress/,/Store API/p'
