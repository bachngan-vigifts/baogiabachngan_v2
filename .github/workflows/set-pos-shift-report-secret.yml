name: Set POS shift report webhook secret
on:
  workflow_dispatch:
    inputs:
      webhook_url:
        description: n8n production webhook URL
        required: true
      webhook_token:
        description: Shared bearer token
        required: true
jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set Edge secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          WEBHOOK_URL: ${{ inputs.webhook_url }}
          WEBHOOK_TOKEN: ${{ inputs.webhook_token }}
        run: supabase secrets set --project-ref "$PROJECT_REF" POS_SHIFT_REPORT_WEBHOOK_URL="$WEBHOOK_URL" POS_SHIFT_REPORT_WEBHOOK_TOKEN="$WEBHOOK_TOKEN"
