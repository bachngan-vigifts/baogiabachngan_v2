name: Fix Minh Long checkout address ETA
on:
  push:
    branches: [codex/minhlong-approved-shipping-20261117]
    paths: [web-minhlong/shipping/fix-eta.mjs, .github/workflows/minhlong-fix-eta.yml]
permissions:
  contents: read
concurrency:
  group: minhlong-shipping-deploy
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l web-minhlong/shipping/ml-shipping-information.php
          node --check web-minhlong/shipping/fix-eta.mjs
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Update ETA event handling and test Select2 desktop/mobile
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          GHN_ML_API_TOKEN: ${{ secrets.GHN_ML_API_TOKEN }}
          GHN_ML_SHOP_ID: ${{ secrets.GHN_ML_SHOP_ID }}
        run: node web-minhlong/shipping/fix-eta.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minhlong-eta-select2
          path: eta-fixed-*.png
          retention-days: 3
