name: Kiểm tra cầu nối địa chỉ Web Lock
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra danh mục tỉnh GHN qua cầu nối Web Lock
        env:
          TOKEN: ${{ secrets.WEB_ORDER_ACTION_TOKEN }}
        run: |
          response=$(curl --silent --show-error --max-time 60 -w '\n%{http_code}' \
            -X POST 'https://locknlockonline.com/wp-json/vigifts/v1/order-action-v7' \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data '{"orderId":21470,"action":"locations"}')
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $code"
          echo "$body" | jq -c 'if .locations then {ok, locationCount:(.locations|length), first:(.locations[0] // null)} else {code,message} end'
          test "$code" = 200
          test "$(echo "$body" | jq -r '.locations | length > 0')" = true
