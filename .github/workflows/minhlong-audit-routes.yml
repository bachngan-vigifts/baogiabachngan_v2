name: Audit Minh Long ETA against GHN routes
on:
  push:
    branches: [codex/minhlong-approved-shipping-20261117]
    paths: [web-minhlong/shipping/audit-routes.mjs, .github/workflows/minhlong-audit-routes.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Compare four destinations without placing orders
        env:
          GHN_ML_API_TOKEN: ${{ secrets.GHN_ML_API_TOKEN }}
          GHN_ML_SHOP_ID: ${{ secrets.GHN_ML_SHOP_ID }}
        run: node web-minhlong/shipping/audit-routes.mjs
