name: Verify Minh Long hero links
on:
  push:
    branches: [fix/minhlong-hero-product-links-20261123]
    paths: [.github/workflows/minhlong-hero-inspect.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: php -l web-minhlong/hero-links/ml-hero-product-links.php
      - run: npm install --prefix /tmp/ml-hero --silent playwright@1.63.0
      - run: node web-minhlong/hero-links/verify.mjs --preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-preview
          path: hero-evidence
          retention-days: 7
