# Đo nút "Thêm vào giỏ hàng" web Lock (chỉ đo, không sửa gì). Chạy từ nhánh khi file .github/addtocart-measure.run đổi.
name: Đo nút thêm giỏ hàng web Lock
on:
  workflow_dispatch:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/addtocart-measure.run']
concurrency: addtocart-measure
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài trình duyệt
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.63.0
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/maintenance/web-lock-addtocart-measure.mjs" /tmp/pw/
      - name: Đo
        working-directory: /tmp/pw
        env:
          LABEL: ${{ vars.LABEL || 'truoc' }}
        run: node web-lock-addtocart-measure.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: addtocart-measure
          path: /tmp/pw/addtocart-*.json
          retention-days: 7
          if-no-files-found: ignore
