name: Kiểm tra API đọc SePay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Đọc giao dịch hôm nay, chỉ in tổng hợp, không ghi CSDL
        env:
          SEPAY_API_TOKEN: ${{ secrets.SEPAY_API_TOKEN }}
        run: node --import tsx scripts/check-sepay-read.ts
