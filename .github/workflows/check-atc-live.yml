# Kiểm tra trang sản phẩm thật của web Lock có đoạn thêm giỏ mới không (chỉ đọc). Chạy khi file .github/check-atc-live.run đổi.
name: Kiểm tra thêm giỏ trên trang thật
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/check-atc-live.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f .github/check-atc-live.run ]; then node scripts/maintenance/check-atc-live.mjs; fi
