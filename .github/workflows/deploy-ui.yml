# Tự đưa giao diện (trial-ui/) lên Cloudflare Pages và gắn tên miền crm.minhlongonline.com.
# Chỉ cần 2 secret: CLOUDFLARE_API_TOKEN (quyền: Account › Cloudflare Pages › Edit; thêm Zone › DNS › Edit nếu
# minhlongonline.com nằm trên Cloudflare) và CLOUDFLARE_ACCOUNT_ID. Thiếu secret thì bỏ qua, không lỗi.
name: Triển khai giao diện
on:
  push:
    branches: [main]
    paths: ['trial-ui/**', 'functions/catalogue/**', 'catalogue-server/**', 'scripts/configure-catalogue-ai.mjs', 'scripts/stamp-catalogue-version.mjs', 'scripts/stamp-ui-version.ts', 'scripts/wait-for-api-deployment.mjs', '.github/workflows/deploy-ui.yml', '.github/workflows/deploy-api.yml']
  workflow_dispatch:
concurrency: deploy-ui
permissions:
  contents: read
  actions: read
env:
  PROJECT: crm-minhlong
  DOMAIN: crm.minhlongonline.com
  SUBDOMAIN: crm
  ZONE: minhlongonline.com
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Xác định source API cần đi cùng giao diện
        id: api-source
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          # Keep paths aligned with deploy-api.yml. First-parent finds the main merge SHA,
          # which actually triggers deployment, rather than a private feature-branch SHA.
          API_SOURCE_SHA=$(git log --first-parent -1 --format=%H HEAD -- src/ supabase/ migrations/postgres/ package-lock.json .github/workflows/deploy-api.yml)
          test -n "$API_SOURCE_SHA"
          echo "sha=$API_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Chờ API tương ứng triển khai thành công
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/github-script@v7
        env:
          API_SOURCE_SHA: ${{ steps.api-source.outputs.sha }}
        with:
          script: |
            const {pathToFileURL} = await import('node:url');
            const {waitForApiDeployment} = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/wait-for-api-deployment.mjs').href);
            await waitForApiDeployment({github,owner:context.repo.owner,repo:context.repo.repo,sha:process.env.API_SOURCE_SHA,log:message=>core.info(message)});
      - name: Thiếu secret Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Chưa có CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID – bỏ qua triển khai giao diện."
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 22.22.0
      - name: Tạo dự án Pages (lần đầu)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main || echo "Dự án đã có."
      - name: Giữ cấu hình Pages và kết nối AI catalogue
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@3 pages download config "$PROJECT" --force
          node scripts/configure-catalogue-ai.mjs
      - name: Ghi số phiên bản (commit) vào giao diện
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/" trial-ui/index.html
      # ?v=<mã băm nội dung> (scripts/stamp-ui-version.ts): file đổi nội dung mới đổi URL; file không đổi giữ URL, trình duyệt dùng lại bản đã lưu.
      - name: Gắn phiên bản vào đường dẫn JS / CSS
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node --experimental-strip-types scripts/stamp-ui-version.ts "${GITHUB_SHA::7}"
      - name: Gắn phiên bản riêng cho catalogue QR v2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/stamp-catalogue-version.mjs "${GITHUB_SHA::7}"
      - name: Đưa giao diện lên
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@3 pages deploy trial-ui --project-name "$PROJECT" --branch main --commit-dirty=true
      - name: Gắn tên miền crm.minhlongonline.com
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          # 1) gắn tên miền vào dự án Pages (đã gắn thì Cloudflare báo trùng – bỏ qua)
          api -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" -d "{\"name\":\"$DOMAIN\"}" | head -c 400; echo
          # 2) địa chỉ *.pages.dev thật của dự án (Cloudflare thêm hậu tố nếu tên đã có người dùng)
          PAGES_HOST=$(api "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" | jq -r '.result.subdomain // empty')
          PAGES_HOST=${PAGES_HOST:-$PROJECT.pages.dev}
          echo "Địa chỉ Pages: https://$PAGES_HOST"
          # 3) nếu minhlongonline.com nằm trên Cloudflare và token có quyền DNS: tạo CNAME crm → <dự án>.pages.dev
          ZONE_ID=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "::notice::Không thấy $ZONE trên Cloudflare (hoặc token không có quyền DNS). Hãy tạo bản ghi CNAME: $SUBDOMAIN → $PAGES_HOST tại nơi quản lý tên miền."
            exit 0
          fi
          EXISTS=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$DOMAIN" | jq -r '.result | length')
          if [ "$EXISTS" = "0" ]; then
            api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" -d "{\"type\":\"CNAME\",\"name\":\"$SUBDOMAIN\",\"content\":\"$PAGES_HOST\",\"proxied\":true}" | jq -c '{success, errors}'
          else
            echo "::warning::Bản ghi DNS $DOMAIN đã có – giữ nguyên, không ghi đè. Kiểm tra nó đang trỏ về $PAGES_HOST."
          fi

