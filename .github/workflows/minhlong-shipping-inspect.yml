name: Minh Long approved shipping preflight
on:
  push:
    branches: [codex/minhlong-approved-shipping-20261117]
    paths: [web-minhlong/shipping/inspect.mjs, .github/workflows/minhlong-shipping-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify Minh Long domain and GHN integration
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: node web-minhlong/shipping/inspect.mjs
