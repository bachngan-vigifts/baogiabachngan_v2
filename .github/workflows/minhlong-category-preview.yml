name: Preview Minh Long category browsing
on:
  push:
    branches: [fix/minhlong-figurine-order-20261123]
    paths: [.github/workflows/minhlong-category-preview.yml, web-minhlong/category-browsing/ml-category-browsing.php, web-minhlong/category-browsing/verify.mjs]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: php -l web-minhlong/category-browsing/ml-category-browsing.php
      - run: python3 web-minhlong/category-browsing/test.py
      - run: npm install --prefix /tmp/ml-sort --silent playwright@1.63.0
      - run: node web-minhlong/category-browsing/verify.mjs --preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-preview
          path: category-evidence
          retention-days: 7
