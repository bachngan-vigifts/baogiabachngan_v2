# Kiểm tra mỗi PR: TypeScript + toàn bộ test (PostgreSQL chạy bằng PGlite, không cần Supabase).
# Không chạy lại khi merge vào main (PR đã kiểm tra; "Triển khai API" vẫn chạy test trước khi deploy) để tiết kiệm phút GitHub Actions.
# Đẩy commit mới lên cùng PR thì lượt kiểm tra cũ đang chạy tự huỷ.
name: Kiểm tra
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-shards:
    name: test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # The two-shard PGlite suite hit the 35m job limit near its final schema tests.
    # Four disjoint file shards keep the same full globs/concurrency as npm test; no tests are skipped.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: PHP runtime for WordPress contract tests
        run: php --version
      - name: PDF text extraction for quote export tests
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y poppler-utils
          fi
      - run: npm ci
      - run: npm run typecheck
      # Node test options must precede the file globs; npm test -- ... appends them too late.
      - run: node --import tsx --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/4 "tests/**/*.test.ts" "src/**/*.test.ts"
  # Preserve the existing required check name; failure/cancellation in any shard fails the gate.
  test:
    if: ${{ always() }}
    needs: test-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require all four test shards
        env:
          RESULT: ${{ needs.test-shards.result }}
        run: test "$RESULT" = success
