# PR-only CI: no duplicate push run. Drafts get fast feedback; ready PRs get the full suite.
# Cloud CI comments remain supplementary, not a substitute for the full suite before merge.
name: Kiểm tra
run-name: >-
  ${{ github.event_name == 'pull_request' && (github.event.pull_request.draft && 'NHÁP — chưa kiểm thử đầy đủ' || 'PR — kiểm thử đầy đủ') || (inputs.full && 'CHẠY TAY — đầy đủ, không thay check PR' || 'CHẠY TAY — smoke, không thay check PR') }} · ${{ github.event.pull_request.number || github.ref_name }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      full:
        description: 'Chạy đủ 4 phần test trên GitHub'
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
concurrency:
  # A manual smoke run must never cancel the PR's full validation (or a manual full run).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.full || false }}
  cancel-in-progress: true
jobs:
  prepare:
    name: TypeScript and draft feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      full: ${{ steps.mode.outputs.full }}
    steps:
      - id: mode
        env:
          FULL: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && inputs.full) }}
        run: echo "full=$FULL" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require current PR head and base
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            try {
              await require('./scripts/ci/pr-freshness.cjs')({ github, context });
            } catch (error) {
              const stale = String(error.message).startsWith('Update branch:');
              await core.summary
                .addHeading(stale ? 'CHƯA CẬP NHẬT NHÁNH — chưa đủ điều kiện' : 'LỖI XÁC MINH — chưa đủ điều kiện')
                .addRaw(stale
                  ? 'Update branch rồi chờ lượt CI mới. Không sử dụng kết quả của merge SHA cũ.'
                  : 'Không xác minh được PR/head/base hiện tại. Xem log bước này để phân biệt lỗi API, dữ liệu hoặc PR đã thay đổi. Không coi đây là full pass.')
                .write();
              throw error;
            }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Typecheck once, not once in each of the four shards as well.
      - run: node --test tests/ci/*.test.cjs
      - run: npm run typecheck
      # These tests also belong to the full suite; do not run them twice on ready PRs.
      - if: steps.mode.outputs.full != 'true'
        run: >-
          node --import tsx --test --test-concurrency=2
          tests/architecture.test.ts
          tests/db/november-migration-gates.test.ts
          tests/app/edge-db-lifecycle.test.ts
          tests/app/catalogue-edge-dependencies.test.ts
          tests/app/appsheet-schema-gate.test.ts
          "tests/app/*-ui.test.ts"
      - name: Require current PR head and base
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            try {
              await require('./scripts/ci/pr-freshness.cjs')({ github, context });
            } catch (error) {
              const stale = String(error.message).startsWith('Update branch:');
              await core.summary
                .addHeading(stale ? 'CHƯA CẬP NHẬT NHÁNH — chưa đủ điều kiện' : 'LỖI XÁC MINH — chưa đủ điều kiện')
                .addRaw(stale
                  ? 'Update branch rồi chờ lượt CI mới. Không sử dụng kết quả của merge SHA cũ.'
                  : 'Không xác minh được PR/head/base hiện tại. Xem log bước này để phân biệt lỗi API, dữ liệu hoặc PR đã thay đổi. Không coi đây là full pass.')
                .write();
              throw error;
            }
      - name: Summarize completed preparation
        env:
          FULL: ${{ steps.mode.outputs.full }}
        run: |
          if [ "$FULL" = true ]; then
            echo "Chuẩn bị và TypeScript đạt. Chưa xác nhận full pass; còn chờ đủ bốn shard và aggregate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TypeScript và smoke đạt. CHƯA chạy bộ test đầy đủ; đây không phải điều kiện cho phép merge PR." >> "$GITHUB_STEP_SUMMARY"
          fi
  full-shards:
    permissions:
      contents: read
    needs: prepare
    # Materialize all four required names; manual smoke has no required contexts.
    if: always() && (github.event_name == 'pull_request' || inputs.full)
    name: ${{ github.event_name == 'pull_request' && 'test shard' || 'manual shard' }} ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    # Four disjoint file shards preserve npm test's complete globs and concurrency.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Refuse unvalidated or draft runs before installing dependencies
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          FULL: ${{ needs.prepare.outputs.full }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          if [ "$PREPARE_RESULT" != success ]; then
            message="CHƯA CHẠY SHARD: bước chuẩn bị lỗi/bị huỷ/thiếu kết quả. Xem prepare để biết lỗi API, stale hay test; không phải full pass."
            echo "$message" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$message"
            exit 1
          fi
          if [ "$FULL" != true ]; then
            if [ "$IS_DRAFT" = true ]; then
              message="NHÁP — CHƯA CHẠY FULL SUITE: prepare đạt; shard chưa chạy theo chế độ nháp. Check đỏ cố ý chặn merge, không phải test shard bị lỗi. Khi sẵn sàng review, chuyển Ready để chạy đủ."
            else
              message="LỖI CHẾ ĐỘ CI: không có xác nhận full=true từ prepare. Shard chưa chạy; không coi đây là full pass."
            fi
            echo "$message" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$message"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: PHP runtime for WordPress contract tests
        run: php --version
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: PDF reader for quote export tests
        run: node --input-type=module -e "const pdf = await import('pdfjs-dist/legacy/build/pdf.mjs'); console.log('PDF.js', pdf.version)"
      - run: node --import tsx --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/4 "tests/**/*.test.ts" "src/**/*.test.ts"
  test:
    # Stable aggregate name. Branch protection is a separate repository setting.
    # Manual smoke results must not impersonate the PR's required check.
    name: ${{ github.event_name == 'pull_request' && 'test' || 'manual validation' }}
    needs: [prepare, full-shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require current PR head and base
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            try {
              await require('./scripts/ci/pr-freshness.cjs')({ github, context });
            } catch (error) {
              const stale = String(error.message).startsWith('Update branch:');
              await core.summary
                .addHeading(stale ? 'CHƯA CẬP NHẬT NHÁNH — chưa đủ điều kiện' : 'LỖI XÁC MINH — chưa đủ điều kiện')
                .addRaw(stale
                  ? 'Update branch rồi chờ lượt CI mới. Không sử dụng kết quả của merge SHA cũ.'
                  : 'Không xác minh được PR/head/base hiện tại. Xem log bước này để phân biệt lỗi API, dữ liệu hoặc PR đã thay đổi. Không coi đây là full pass.')
                .write();
              throw error;
            }
      - name: Require every expected check to pass
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          FULL_REQUIRED: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && inputs.full) }}
          SHARD_RESULT: ${{ needs.full-shards.result }}
        run: |
          report() {
            echo "$1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$1"
          }
          if [ "$PREPARE_RESULT" != success ]; then
            report "CHƯA ĐỦ ĐIỀU KIỆN: prepare lỗi/bị huỷ/thiếu kết quả. Xem prepare; không coi đây là smoke hoặc full pass."
            exit 1
          fi
          if [ "$IS_PR" = true ] && [ "$FULL_REQUIRED" != true ]; then
            report "NHÁP — CHƯA KIỂM THỬ ĐẦY ĐỦ: TypeScript và smoke đạt; bốn shard chưa chạy. Required checks đỏ cố ý chặn merge. Khi sẵn sàng review, chuyển Ready để chạy đủ."
            exit 1
          fi
          if [ "$FULL_REQUIRED" = true ]; then
            if [ "$SHARD_RESULT" != success ]; then
              report "CHƯA ĐẠT FULL SUITE: shard lỗi/bị huỷ/skipped/thiếu kết quả. Cần đủ bốn shard thành công trên lượt CI hợp lệ."
              exit 1
            fi
            echo "TypeScript and all four full-suite shards passed."
          else
            test "$SHARD_RESULT" = skipped || exit 1
            echo "Draft/manual smoke checks only. Full suite is required when the PR becomes ready."
          fi
