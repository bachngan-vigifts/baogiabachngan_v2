# Kiểm tra mỗi PR và mỗi lần đẩy lên main: TypeScript + toàn bộ test (PostgreSQL chạy bằng PGlite, không cần Supabase).
name: Kiểm tra
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
