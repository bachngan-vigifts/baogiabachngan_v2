# Kiểm tra mỗi PR: TypeScript + toàn bộ test (PostgreSQL chạy bằng PGlite, không cần Supabase).
# Không chạy lại khi merge vào main (PR đã kiểm tra; "Triển khai API" vẫn chạy test trước khi deploy) để tiết kiệm phút GitHub Actions.
# Đẩy commit mới lên cùng PR thì lượt kiểm tra cũ đang chạy tự huỷ.
name: Kiểm tra
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-shards:
    name: test shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    # The unsharded PGlite suite hit 35m after 1,050 tests on a hosted runner; with ~1,900 tests one of two shards hit 35m again
    # (PR 521: shard 1/2 cancelled at test 873, all passing). Three disjoint file shards use the same full globs/concurrency as
    # npm test; no tests are skipped and the per-shard timeout is unchanged.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: PHP runtime for WordPress contract tests
        run: php --version
      - run: npm ci
      - run: npm run typecheck
      # Node test options must precede the file globs; npm test -- ... appends them too late.
      - run: node --import tsx --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/3 "tests/**/*.test.ts" "src/**/*.test.ts"
  # Preserve the existing required check name; failure/cancellation in any shard fails the gate.
  test:
    if: ${{ always() }}
    needs: test-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require all test shards
        env:
          RESULT: ${{ needs.test-shards.result }}
        run: test "$RESULT" = success
