# Chạy tay một lượt đồng bộ Sapo (kiểm tra / khắc phục). Lịch tự động chạy trong Supabase (pg_cron, supabase/sapo-cron.sql)
# để không tốn phút GitHub Actions của repo riêng tư. Cần secret SAPO_SYNC_TOKEN.
name: Đồng bộ Sapo
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Phạm vi đồng bộ (retail chỉ bổ sung khách lẻ chưa có)'
        type: choice
        options: [all, retail]
        default: all
concurrency: sapo-pull
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SAPO_SYNC_TOKEN: ${{ secrets.SAPO_SYNC_TOKEN }}
      SYNC_SCOPE: ${{ inputs.scope }}
      URL: https://taceqfnsorewelsbdckg.supabase.co/functions/v1/baogia-v2-api/api/staff/integrations/sapo/pull
    steps:
      - name: Thiếu SAPO_SYNC_TOKEN
        if: env.SAPO_SYNC_TOKEN == ''
        run: echo "::warning::Chưa có secret SAPO_SYNC_TOKEN – bỏ qua đồng bộ Sapo."
      - name: Lấy dữ liệu mới từ Sapo
        if: env.SAPO_SYNC_TOKEN != '' && inputs.scope != 'retail'
        run: |
          body=$(curl -sS -m 400 -X POST "$URL" -H "Authorization: Bearer $SAPO_SYNC_TOKEN" -H 'Content-Type: application/json' -d '{}' -w '\n%{http_code}')
          code=$(echo "$body" | tail -n1); json=$(echo "$body" | sed '$d')
          echo "$json" | jq -c '{ok, code, error, results, unknownPolicies, unknownWarehouses}' || echo "$json" | head -c 500
          [ "$code" = "200" ] || { echo "::error::Gọi đồng bộ lỗi HTTP $code"; exit 1; }
          if [ "$(echo "$json" | jq -r '.ok')" != "true" ]; then echo "::warning::$(echo "$json" | jq -r '.error')"; fi

      - name: Bổ sung khách lẻ (chỉ thêm mới, tiếp tục theo trang)
        if: env.SAPO_SYNC_TOKEN != '' && inputs.scope == 'retail'
        run: |
          set -eu
          endpoint="${URL%/pull}/retail-customers/pull"
          for batch in $(seq 1 60); do
            code=$(curl -sS -m 120 -o /tmp/retail-result.json -w '%{http_code}' -X POST "$endpoint" -H "Authorization: Bearer $SAPO_SYNC_TOKEN" -H 'Content-Type: application/json' -d '{}')
            [ "$code" = "200" ] || { jq -c '{error,code}' /tmp/retail-result.json; exit 1; }
            jq -c '{page,completed,totals,warning}' /tmp/retail-result.json
            if [ "$(jq -r '.completed' /tmp/retail-result.json)" = "true" ]; then
              [ -z "$(jq -r '.warning // empty' /tmp/retail-result.json)" ] || { echo '::warning::Cần đối chiếu nhóm khách trước khi chốt hoàn tất.'; }
              exit 0
            fi
          done
          echo '::error::Chưa hết trang; chạy lại để tiếp tục, không nhập trùng.'
          exit 1
