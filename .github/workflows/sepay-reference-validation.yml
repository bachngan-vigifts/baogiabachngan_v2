name: Validate SePay web reference reliability
on:
  push:
    branches: [codex/sepay-web-reference-reliability-20261119]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sepay-reference-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test --test-concurrency=2 tests/app/sepay-web.test.ts tests/app/sepay-proximity.test.ts tests/app/sepay-payment.test.ts
