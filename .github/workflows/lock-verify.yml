# KIỂM TRA CHỈ ĐỌC sau một thay đổi do anh Thái làm trong quản trị: plugin còn nạp không, thời gian khởi động WordPress, CPU. Chạy khi .github/lock-verify.run đổi.
name: Kiểm tra nhanh web Lock (chỉ đọc)
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/lock-verify.run']
concurrency: lock-diagnose
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      LOCKNLOCK_DOCROOT: ${{ secrets.LOCKNLOCK_DOCROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          [ -f .github/lock-verify.run ] || exit 0
          MODE=sample SAMPLE_SECONDS=150 node scripts/diagnose/lock-server-read.mjs > sample.log 2>&1 &
          if [ "$(cat .github/lock-verify.run)" = purge ]; then node scripts/diagnose/lock-purge-log.mjs; MODE=sample SAMPLE_SECONDS=40 node scripts/diagnose/lock-server-read.mjs; exit 0; fi; if [ "$(cat .github/lock-verify.run)" = login ]; then mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.63.0 && npx playwright install --with-deps chromium >/dev/null && cp "$GITHUB_WORKSPACE"/scripts/diagnose/lock-login-probe.mjs "$GITHUB_WORKSPACE"/scripts/maintenance/web-lock-buy-test.mjs . && echo "##### ĐĂNG NHẬP" && node lock-login-probe.mjs; echo "##### NÚT GIỎ VÀ MUA NGAY"; ONLY=2,4,6 node web-lock-buy-test.mjs | sed -n "/TÓM TẮT/,\$p"; cd "$GITHUB_WORKSPACE"; echo "##### MÁY CHỦ"; PARALLEL=0 node scripts/diagnose/lock-server-timing.mjs | sed -n "/Khởi động/,\$p"; exit 0; fi; if [ "$(cat .github/lock-verify.run)" = admin ]; then echo "##### QUẢN TRỊ"; node scripts/diagnose/lock-admin-check.mjs; echo "##### LOG LỖI"; MODE=state node scripts/diagnose/lock-server-read.mjs; exit 0; fi; if [ "$(cat .github/lock-verify.run)" = errors ]; then echo "##### LOG LỖI"; MODE=state node scripts/diagnose/lock-server-read.mjs; node scripts/diagnose/lock-plugin-check.mjs; PARALLEL=0 RUNS=3 node scripts/diagnose/lock-server-timing.mjs 2>&1 | head -20; exit 0; fi; echo "##### PLUGIN"; node scripts/diagnose/lock-plugin-check.mjs || true; [ "$(cat .github/lock-verify.run)" = plugin ] && exit 0
          echo "##### THỜI GIAN MÁY CHỦ"; PARALLEL=0 node scripts/diagnose/lock-server-timing.mjs || true
          wait; echo "##### CPU/RAM"; cat sample.log
