# Thêm mu-plugin woo-fragments-guest-skip.php (khách chưa có giỏ không gọi cart fragments) lên web Lock.
# Quy trình: đo trước (3 lượt) -> thêm file mới (web lỗi thì tự gỡ) -> dọn cache trang -> kiểm tra sau (3 lượt: khách mới 0 lệnh fragments, giỏ mini đúng sau thêm giỏ, thanh toán có tổng) -> không đạt thì tự gỡ.
# Chạy khi .github/woo-fragments-guest-skip.run đổi (từ đầu tiên: dry-run, apply hoặc rollback).
name: Bớt cart fragments cho khách mới web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/woo-fragments-guest-skip.run']
concurrency: woo-fragments-guest-skip
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      LOCKNLOCK_DOCROOT: ${{ secrets.LOCKNLOCK_DOCROOT }}
      FILE: woo-fragments-guest-skip.php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Xác định chế độ
        id: mode
        run: |
          if [ -f .github/woo-fragments-guest-skip.run ]; then m=$(head -c 20 .github/woo-fragments-guest-skip.run | awk '{print $1}'); else m=skip; fi
          case "$m" in dry-run|apply|rollback) ;; *) m=skip ;; esac
          echo "Chế độ: $m"; echo "mode=$m" >> "$GITHUB_OUTPUT"
      - name: Cài trình duyệt
        if: steps.mode.outputs.mode == 'dry-run' || steps.mode.outputs.mode == 'apply'
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.63.0
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/maintenance/web-lock-fragments-check.mjs" /tmp/pw/
      - name: Đo trước
        if: steps.mode.outputs.mode == 'dry-run' || steps.mode.outputs.mode == 'apply'
        working-directory: /tmp/pw
        run: node web-lock-fragments-check.mjs || true
      - name: Kiểm tra và thêm file
        if: steps.mode.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: node scripts/maintenance/cpanel-deploy-newfile.mjs
      - name: Dọn cache trang
        if: steps.mode.outputs.mode == 'apply' || steps.mode.outputs.mode == 'rollback'
        continue-on-error: true
        env:
          MODE: apply
        run: node scripts/maintenance/cpanel-purge-lscache.mjs
      - name: Kiểm tra sau
        id: verify
        if: steps.mode.outputs.mode == 'apply'
        continue-on-error: true
        working-directory: /tmp/pw
        env:
          EXPECT_SKIP: '1'
        run: node web-lock-fragments-check.mjs
      - name: Tự gỡ nếu kiểm tra sau không đạt
        if: steps.mode.outputs.mode == 'apply' && steps.verify.outcome == 'failure'
        env:
          MODE: rollback
        run: |
          node scripts/maintenance/cpanel-deploy-newfile.mjs
          MODE=apply node scripts/maintenance/cpanel-purge-lscache.mjs
          echo "ĐÃ GỠ plugin vì kiểm tra sau không đạt"; exit 1
