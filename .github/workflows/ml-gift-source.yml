name: Inspect Minh Long promotion renderer
on:
  push:
    branches: [fix/minhlong-qv-gifts-20261126]
    paths: [.github/workflows/ml-gift-source.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read promotion source
        env:
          CPANEL_BASE_URL: ${{ secrets.CPANEL_BASE_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: node web-minhlong/qv-gift/source.mjs
