# Xem trước giao diện thanh toán điện thoại của web Lock (chỉ đọc + áp CSS thử trong trình duyệt, không đổi web). Chạy khi file .github/checkout-preview.run đổi.
name: Xem trước thanh toán mobile web Lock
on:
  push:
    branches: [probe/cpanel-readonly]
    paths: ['.github/checkout-preview.run']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chạy
        run: |
          [ -f .github/checkout-preview.run ] || exit 0
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1.63.0
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/maintenance/web-lock-checkout-preview.mjs" . 
          export CSS_FROM="$GITHUB_WORKSPACE/web-lock/mu-plugins/woo-checkout-mobile.php"
          [ -f "$GITHUB_WORKSPACE/web-lock/mu-plugins/woo-checkout-mobile-top.php" ] && CSS_FROM="$CSS_FROM,$GITHUB_WORKSPACE/web-lock/mu-plugins/woo-checkout-mobile-top.php"
          OUTLINE=1 node web-lock-checkout-preview.mjs
